<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplikasi Kasir</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1>Aplikasi Kasir</h1>
        <p>Manajemen produk, keranjang, pembayaran, struk, dan riwayat penjualan.</p>
      </div>
      <div class="status">
        <span id="todayDate"></span>
      </div>
    </header>

    <main class="app-grid">
      <section class="panel panel-left">
        <div class="panel-header">
          <h2>Daftar Produk</h2>
          <input id="searchInput" type="search" placeholder="Cari produk atau kategori..." />
        </div>

        <div class="product-controls">
          <button id="showAddProductBtn" class="btn btn-primary">Tambah Produk Baru</button>
        </div>

        <div id="productList" class="product-list"></div>
      </section>

      <section class="panel panel-right">
        <div class="panel-header">
          <h2>Kasir & Pembayaran</h2>
        </div>

        <div class="cart-summary">
          <div class="cart-info">
            <span>Total Item: <strong id="cartCount">0</strong></span>
            <span>Subtotal: <strong id="cartSubtotal">Rp 0</strong></span>
          </div>
        </div>

        <div id="cartList" class="cart-list"></div>

        <div class="payment-panel">
          <div class="form-row">
            <label for="discountInput">Diskon (%)</label>
            <input id="discountInput" type="number" min="0" max="100" value="0" />
          </div>
          <div class="form-row">
            <label for="taxInput">PPN (%)</label>
            <input id="taxInput" type="number" min="0" max="100" value="10" />
          </div>
          <div class="form-row">
            <label for="paymentMethod">Metode Bayar</label>
            <select id="paymentMethod">
              <option value="cash">Tunai</option>
              <option value="card">Kartu</option>
            </select>
          </div>
          <div class="form-row">
            <label for="cashInput">Jumlah Bayar</label>
            <input id="cashInput" type="number" min="0" step="0.01" value="0" />
          </div>
          <div class="payment-row">
            <div>
              <span>Total Akhir</span>
              <strong id="cartTotal">Rp 0</strong>
            </div>
            <div>
              <span>Kembalian</span>
              <strong id="changeAmount">Rp 0</strong>
            </div>
          </div>
          <button id="checkoutBtn" class="btn btn-success">Bayar & Cetak Struk</button>
        </div>
      </section>
    </main>

    <section class="panel panel-bottom">
      <div class="panel-header">
        <h2>Riwayat Penjualan</h2>
      </div>
      <div id="salesHistory" class="history-list"></div>
    </section>
  </div>

  <div id="productModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <h2 id="modalTitle">Tambah Produk</h2>
      <div class="form-row">
        <label for="productNameInput">Nama Produk</label>
        <input id="productNameInput" type="text" placeholder="Contoh: Susu" />
      </div>
      <div class="form-row">
        <label for="productCategoryInput">Kategori</label>
        <input id="productCategoryInput" type="text" placeholder="Contoh: Minuman" />
      </div>
      <div class="form-row">
        <label for="productPriceInput">Harga</label>
        <input id="productPriceInput" type="number" min="0" step="0.01" placeholder="10000" />
      </div>
      <div class="form-row">
        <label for="productStockInput">Stok</label>
        <input id="productStockInput" type="number" min="0" step="1" placeholder="10" />
      </div>
      <div class="modal-actions">
        <button id="saveProductBtn" class="btn btn-success">Simpan</button>
        <button id="cancelProductBtn" class="btn btn-secondary">Batal</button>
      </div>
    </div>
  </div>

  <div id="receiptModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content receipt-modal">
      <h2>Struk Penjualan</h2>
      <div id="receiptContent"></div>
      <div class="modal-actions">
        <button id="printReceiptBtn" class="btn btn-primary">Cetak</button>
        <button id="closeReceiptBtn" class="btn btn-secondary">Tutup</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
